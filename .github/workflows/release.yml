# Publishes a release when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# Tags with a pre-release suffix (v1.2.3-beta.1) are published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of the workflow: replace the assets, keep the notes.
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          if [ "$NOTARIZED" != "true" ]; then
            if [ "$SIGNED" = "true" ]; then
              note="This build is signed with Developer ID but not notarized."
            else
              note="This build is not signed. macOS will block it on first launch; right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/Swiftbus.app\`."
            fi
            printf '> %s\n\n' "$note" > notes.md
          else
            : > notes.md
          fi

          args=(--verify-tag --title "Swiftbus $VERSION" --generate-notes --notes-file notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${args[@]}"

      - name: Publish the update feed
        # The app reads releases/latest/download/appcast.xml, so only full releases need a feed
        # (GitHub's "latest" never points at a pre-release).
        if: needs.build.outputs.sparkle-signature != '' && !contains(needs.build.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          SIGNATURE: ${{ needs.build.outputs.sparkle-signature }}
        run: |
          set -euo pipefail
          # Release notes as HTML, rendered by GitHub, for Sparkle's update window.
          gh release view "$TAG" --json body --jq .body > notes.md
          notes=$(gh api markdown -f text="$(cat notes.md)" -f mode=gfm -f context="$GH_REPO" | sed 's/]]>/]]]]><![CDATA[>/g')
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Swiftbus</title>
              <link>https://github.com/$GH_REPO/releases</link>
              <item>
                <title>Swiftbus $VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$GH_REPO/releases/tag/$TAG</sparkle:fullReleaseNotesLink>
                <description><![CDATA[$notes]]></description>
                <enclosure url="https://github.com/$GH_REPO/releases/download/$TAG/$ARTIFACT.dmg" type="application/octet-stream" $SIGNATURE />
              </item>
            </channel>
          </rss>
          EOF
          gh release upload "$TAG" appcast.xml --clobber
