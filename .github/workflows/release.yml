# Publishes a release when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# Tags with a pre-release suffix (v1.2.3-beta.1) are published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of the workflow: replace the assets, keep the notes.
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          if [ "$NOTARIZED" != "true" ]; then
            if [ "$SIGNED" = "true" ]; then
              note="This build is signed with Developer ID but not notarized."
            else
              note="This build is not signed. macOS will block it on first launch; right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/Swiftbus.app\`."
            fi
            printf '> %s\n\n' "$note" > notes.md
          else
            : > notes.md
          fi

          args=(--verify-tag --title "Swiftbus $VERSION" --generate-notes --notes-file notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${args[@]}"
